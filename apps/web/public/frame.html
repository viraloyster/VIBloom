<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Muse's views run here: a sandboxed frame with an opaque origin and no
         network, storage or access to the page that holds the key. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070b;
        color: #e9eef6;
        color-scheme: dark;
        font:
          13px/1.4 system-ui,
          sans-serif;
      }
    </style>
    <script>
      // A picture of what is on screen, for Muse to check its own drawing:
      // the live DOM, canvases as images, drawn into a canvas through SVG.
      async function snapshot() {
        const w = innerWidth;
        const h = innerHeight;
        const clone = document.documentElement.cloneNode(true);
        const live = document.querySelectorAll("canvas");
        clone.querySelectorAll("canvas").forEach((c, i) => {
          const img = document.createElement("img");
          try {
            img.src = live[i].toDataURL();
          } catch {}
          img.setAttribute("style", live[i].getAttribute("style") || "");
          img.width = live[i].clientWidth || live[i].width;
          img.height = live[i].clientHeight || live[i].height;
          c.replaceWith(img);
        });
        clone.querySelectorAll("script").forEach((s) => s.remove());
        const xhtml = new XMLSerializer().serializeToString(clone);
        const svg =
          `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}">` +
          `<foreignObject width="100%" height="100%">${xhtml}</foreignObject></svg>`;
        const img = new Image();
        img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
        await img.decode();
        const out = document.createElement("canvas");
        out.width = w;
        out.height = h;
        const g = out.getContext("2d");
        g.fillStyle = "#05070b";
        g.fillRect(0, 0, w, h);
        g.drawImage(img, 0, 0);
        return out.toDataURL("image/jpeg", 0.85);
      }
      window.addEventListener("message", (e) => {
        if (e.source !== window.parent || !e.data) return;
        if (e.data.snapshot) {
          snapshot().then(
            (image) => parent.postMessage({ snapshot: e.data.snapshot, image }, "*"),
            (err) => parent.postMessage({ snapshot: e.data.snapshot, error: String(err) }, "*"),
          );
          return;
        }
        if (typeof e.data.html !== "string") return;
        window.VIBLOOM = Object.freeze(e.data.data || {});
        document.body.innerHTML = e.data.html;
        // Scripts inserted as HTML do not run; recreate them so they do.
        for (const old of document.body.querySelectorAll("script")) {
          const s = document.createElement("script");
          s.textContent = old.textContent;
          old.replaceWith(s);
        }
      });
    </script>
  </head>
  <body></body>
</html>
