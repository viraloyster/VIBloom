<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Muse's views run here: a sandboxed frame with an opaque origin and no
         network, storage or access to the page that holds the key. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070b;
        color: #e9eef6;
        color-scheme: dark;
        font:
          13px/1.4 system-ui,
          sans-serif;
      }
    </style>
    <script>
      window.addEventListener("message", (e) => {
        if (e.source !== window.parent || !e.data || typeof e.data.html !== "string") return;
        window.VIBLOOM = Object.freeze(e.data.data || {});
        document.body.innerHTML = e.data.html;
        // Scripts inserted as HTML do not run; recreate them so they do.
        for (const old of document.body.querySelectorAll("script")) {
          const s = document.createElement("script");
          s.textContent = old.textContent;
          old.replaceWith(s);
        }
      });
    </script>
  </head>
  <body></body>
</html>
