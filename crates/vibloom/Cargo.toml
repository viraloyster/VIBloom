[package]
name = "vibloom"
version = "0.1.0"
description = "Assumptions, invariants and intentions for code projects and the AI agents working in them."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
