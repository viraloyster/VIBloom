name: Release guard

# Push a tag like guard-v0.2.0 (matching crates/vibloom/Cargo.toml) to build
# the vibloom binary for each platform and publish it with its SHA-256. Run it
# by hand to build and test every platform without publishing.
on:
  push:
    tags: ["guard-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          want="guard-v$(sed -n 's/^version = "\(.*\)"/\1/p' crates/vibloom/Cargo.toml | head -1)"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME, crate $want"; exit 1; }
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test --locked -p vibloom
        if: matrix.target != 'x86_64-apple-darwin'
      - run: cargo build --locked --release -p vibloom --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          ext=""; [ "${{ runner.os }}" = Windows ] && ext=".exe"
          version="$(sed -n 's/^version = "\(.*\)"/v\1/p' crates/vibloom/Cargo.toml | head -1)"
          name="vibloom-$version-${{ matrix.target }}$ext"
          mkdir dist
          cp "target/${{ matrix.target }}/release/vibloom$ext" "dist/$name"
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$name" > "$name.sha256"
          else shasum -a 256 "$name" > "$name.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "vibloom ${GITHUB_REF_NAME#guard-}" \
            --notes "The vibloom binary for code projects. Check a download against its .sha256 file. The binaries are not code-signed yet."
